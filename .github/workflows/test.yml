name: Test

# Pull requests run these jobs. The release workflow calls this before it publishes.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/squirrelbot

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQUIRRELBOT_TEST_DATABASE_URL: postgres://squirrelbot:squirrelbot@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squirrelbot
          POSTGRES_PASSWORD: squirrelbot
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squirrelbot -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: API end-to-end tests
        run: go test -tags e2e -count=1 -timeout 20m ./e2e

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Dashboard end-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint and render
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/lint-values.yaml" <<'EOF'
          publicUrl: https://mod.example.com
          secrets:
            databaseUrl: postgres://squirrelbot:password@db:5432/squirrelbot?sslmode=disable
            discordToken: token
            discordClientId: client
            discordClientSecret: secret
            sessionSecret: 0123456789abcdef0123456789abcdef
          EOF
          helm lint deploy/helm/squirrelbot -f "${RUNNER_TEMP}/lint-values.yaml"
          helm template squirrelbot deploy/helm/squirrelbot -f "${RUNNER_TEMP}/lint-values.yaml" >/dev/null

  image:
    name: Image build
    # The release job builds and pushes the image. This checks the Dockerfile on a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: squirrelbot:pr
          provenance: false
          sbom: false
