name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an outdated pull request run. Queue releases so two merges publish in order.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/squirrelbot

  e2e:
    name: End-to-end tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQUIRRELBOT_TEST_DATABASE_URL: postgres://squirrelbot:squirrelbot@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squirrelbot
          POSTGRES_PASSWORD: squirrelbot
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squirrelbot -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: API end-to-end tests
        run: go test -tags e2e -count=1 -timeout 20m ./e2e

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Dashboard end-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  chart:
    name: Helm chart
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/lint-values.yaml" <<'EOF'
          publicUrl: https://mod.example.com
          secrets:
            databaseUrl: postgres://squirrelbot:password@db:5432/squirrelbot?sslmode=disable
            discordToken: token
            discordClientId: client
            discordClientSecret: secret
            sessionSecret: 0123456789abcdef0123456789abcdef
          EOF
          helm lint deploy/helm/squirrelbot -f "${RUNNER_TEMP}/lint-values.yaml"
          helm template squirrelbot deploy/helm/squirrelbot -f "${RUNNER_TEMP}/lint-values.yaml" >/dev/null

  image:
    name: Image build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: squirrelbot:pr
          provenance: false
          sbom: false

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # A newer merge publishes one release. A direct push to main does not.
      - name: Release this commit only when a pull request merged it
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main has moved past this commit. The newer run will publish the release."
            exit 0
          fi
          if git log -1 --format=%B | grep -F -q '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This commit skips the release."
            exit 0
          fi
          prs=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          merged=$(printf '%s' "$prs" | jq '[.[] | select(.merged == true and .base.ref == "main")]')
          if [ "$(printf '%s' "$merged" | jq 'length')" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This push did not come from a pull request merged into main."
            exit 0
          fi
          if printf '%s' "$merged" | jq -e 'any(.[]; ((.title // "") | contains("[skip release]")) or ((.body // "") | contains("[skip release]")))' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The merged pull request skips the release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Choose the version
        id: version
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: patch
        run: |
          set -euo pipefail
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "unsupported bump: $BUMP" >&2; exit 1 ;;
          esac

          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          owner="${image#ghcr.io/}"
          owner="${owner%%/*}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "chart=ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"

          latest=$(git tag --list 'v*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          if [ -n "$latest" ] && [ "$(git rev-parse "${latest}^{}")" = "$(git rev-parse HEAD)" ]; then
            version="${latest#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            if gh release view "$latest" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "resume=false" >> "$GITHUB_OUTPUT"
              echo "${latest} is already released."
              exit 0
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            echo "Finishing ${latest}. The tag exists and the GitHub release does not."
            exit 0
          fi

          bump() {
            local ver=$1 kind=$2
            local major minor patch
            IFS=. read -r major minor patch <<< "$ver"
            case "$kind" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            printf '%s.%s.%s\n' "$major" "$minor" "$patch"
          }

          if [ -z "$latest" ]; then
            version=0.1.0
          else
            version=$(bump "${latest#v}" "$BUMP")
          fi
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "resume=false" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Set up Go
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Helm
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: azure/setup-helm@v4

      - name: Set up QEMU
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build archives
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          mkdir -p dist
          targets='linux/amd64 linux/arm64 darwin/amd64 darwin/arm64'
          for target in $targets; do
            os=${target%/*}
            arch=${target#*/}
            stage=$(mktemp -d)
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$stage/squirrelbot" ./cmd/squirrelbot
            mkdir -p "$stage/web"
            cp -a web/build "$stage/web/build"
            cp LICENSE "$stage/LICENSE"
            tar -C "$stage" -czf "dist/squirrelbot_${VERSION}_${os}_${arch}.tar.gz" squirrelbot web LICENSE
            rm -rf "$stage"
          done

      - name: Package the chart
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          set -euo pipefail
          chart="${RUNNER_TEMP}/squirrelbot"
          rm -rf "$chart"
          cp -a deploy/helm/squirrelbot "$chart"
          CHART_DIR="$chart" python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          image = os.environ["IMAGE"]
          root = Path(os.environ["CHART_DIR"])

          chart = root / "Chart.yaml"
          lines = chart.read_text().splitlines()
          saw_version = False
          saw_app = False
          for i, line in enumerate(lines):
              if line.startswith("version:"):
                  lines[i] = f"version: {version}"
                  saw_version = True
              elif line.startswith("appVersion:"):
                  lines[i] = f'appVersion: "{version}"'
                  saw_app = True
          if not saw_version or not saw_app:
              raise SystemExit("Chart.yaml is missing version or appVersion")
          chart.write_text("\n".join(lines) + "\n")

          values = root / "values.yaml"
          lines = values.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.startswith("  repository:"):
                  lines[i] = f"  repository: {image}"
                  found = True
                  break
          if not found:
              raise SystemExit("image.repository is missing from values.yaml")
          values.write_text("\n".join(lines) + "\n")
          PY
          helm package "$chart" --destination dist
          (
            cd dist
            sha256sum squirrelbot_"${VERSION}"_*.tar.gz "squirrelbot-${VERSION}.tgz" > SHA256SUMS
          )

      - name: Confirm main has not moved
        id: recheck
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main moved during the build. A newer run will publish the release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MPL-2.0
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push the chart
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART: ${{ steps.version.outputs.chart }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/squirrelbot-${VERSION}.tgz" "oci://${CHART}"

      - name: Publish the GitHub release
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          CHART: ${{ steps.version.outputs.chart }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME: ${{ steps.version.outputs.resume }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during publish. A newer run will release."
            exit 0
          fi
          if [ "$RESUME" != "true" ]; then
            git tag "v${VERSION}"
          fi
          git push origin "v${VERSION}"

          latest=$(git tag --list 'v*' --sort=-v:refname | awk -v current="v${VERSION}" '$0 != current && /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo "Container image: \`${IMAGE}:${VERSION}\`"
            echo
            echo "Helm chart:"
            echo
            echo '```sh'
            echo "helm upgrade --install squirrelbot oci://${CHART}/squirrelbot --version ${VERSION}"
            echo '```'
            echo
            echo "Binary archives include \`squirrelbot\`, \`web/build\`, and \`LICENSE\`. Extract an archive and run \`./squirrelbot\` from that directory."
            echo
            echo "Changes:"
            echo
            if [ -n "$latest" ]; then
              git log --pretty=format:'- %s' "${latest}..v${VERSION}"
            else
              git log --pretty=format:'- %s' "v${VERSION}"
            fi
            echo
          } > "$notes"

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "$notes" \
            "dist/SHA256SUMS" \
            dist/squirrelbot_"${VERSION}"_*.tar.gz \
            "dist/squirrelbot-${VERSION}.tgz"

      - name: Set package visibility
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          set -euo pipefail
          image_name="${IMAGE##*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          visibility=private
          if [ "$VISIBILITY" = "public" ]; then
            visibility=public
          fi
          for name in "$image_name" "charts/${image_name}"; do
            gh api --method PATCH "/orgs/${owner}/packages/container/${name}" -f visibility="$visibility" \
              || gh api --method PATCH "/users/${owner}/packages/container/${name}" -f visibility="$visibility" \
              || echo "Could not set ${name} visibility to ${visibility}." >&2
          done
