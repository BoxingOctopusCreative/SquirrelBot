name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an outdated pull request run. Queue releases so two merges publish in order.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/squirrelbot

  e2e:
    name: End-to-end tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQUIRRELBOT_TEST_DATABASE_URL: postgres://squirrelbot:squirrelbot@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squirrelbot
          POSTGRES_PASSWORD: squirrelbot
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squirrelbot -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: API end-to-end tests
        run: go test -tags e2e -count=1 -timeout 20m ./e2e

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Dashboard end-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  chart:
    name: Helm chart
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/lint-values.yaml" <<'EOF'
          publicUrl: https://mod.example.com
          secrets:
            databaseUrl: postgres://squirrelbot:password@db:5432/squirrelbot?sslmode=disable
            discordToken: token
            discordClientId: client
            discordClientSecret: secret
            sessionSecret: 0123456789abcdef0123456789abcdef
          EOF
          helm lint deploy/helm/squirrelbot -f "${RUNNER_TEMP}/lint-values.yaml"
          helm template squirrelbot deploy/helm/squirrelbot -f "${RUNNER_TEMP}/lint-values.yaml" >/dev/null

  image:
    name: Image build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: squirrelbot:pr
          provenance: false
          sbom: false

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # A newer merge publishes one release. A direct push to main does not.
      - name: Release this commit only when a pull request merged it
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/chart-commit.sh" << 'EOF'
          is_chart_commit() {
            local sha=$1 parent=$2 version=${3:-}
            local subject files parent_sha
            parent_sha=$(git rev-parse "${sha}^" 2>/dev/null) || return 1
            [ "$parent_sha" = "$parent" ] || return 1
            files=$(git diff-tree --no-commit-id --name-only -r "$sha")
            [ "$files" = "deploy/helm/squirrelbot/Chart.yaml" ] || return 1
            git log -1 --format=%b "$sha" | grep -F -q '[skip release]' || return 1
            subject=$(git log -1 --format=%s "$sha")
            if [ -n "$version" ]; then
              [ "$subject" = "Update the Helm chart to ${version}." ]
              return
            fi
            case "$subject" in
              "Update the Helm chart to "[0-9]*.[0-9]*.[0-9]*.) return 0 ;;
              *) return 1 ;;
            esac
          }
          EOF
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/chart-commit.sh"
          git fetch origin main --tags --force
          head=$(git rev-parse HEAD)
          main=$(git rev-parse origin/main)
          if [ "$head" != "$main" ] && ! is_chart_commit "$main" "$head"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main has moved past this commit. The newer run will publish the release."
            exit 0
          fi
          if git log -1 --format=%B | grep -F -q '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This commit skips the release."
            exit 0
          fi
          prs=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          # This endpoint leaves .merged null and sets .merged_at for a merged pull request.
          merged=$(printf '%s' "$prs" | jq '[.[] | select(.base.ref == "main" and .merged_at != null)]')
          if [ "$(printf '%s' "$merged" | jq 'length')" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This push did not come from a pull request merged into main."
            exit 0
          fi
          echo "Publishing pull request #$(printf '%s' "$merged" | jq -r '.[0].number')."
          if printf '%s' "$merged" | jq -e 'any(.[]; ((.title // "") | contains("[skip release]")) or ((.body // "") | contains("[skip release]")))' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The merged pull request skips the release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Git pushes in this job authenticate as the squirrelbot-ci app.
      - name: Authenticate git as squirrelbot-ci
        if: steps.gate.outputs.skip != 'true'
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          app_id=$(printf '%s' "$APP_ID" | tr -d '[:space:]')
          case "$app_id" in
            ''|*[!0-9]*) echo "RELEASE_APP_ID must be the numeric app id." >&2; exit 1 ;;
          esac
          key_file=$(mktemp)
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key_file"
          tr -d '\r' < "$key_file" > "${key_file}.unix"
          mv "${key_file}.unix" "$key_file"
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$key_file"; then
            echo "RELEASE_APP_PRIVATE_KEY is not a PEM private key." >&2
            exit 1
          fi
          if [ "$(grep -cve '^[[:space:]]*$' "$key_file")" -eq 1 ]; then
            perl -0pe 's/\\n/\n/g' "$key_file" > "${key_file}.pem"
            mv "${key_file}.pem" "$key_file"
          fi
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((now - 60))" "$((now + 540))" "$app_id" | b64url)
          signature=$(printf '%s' "${header}.${payload}" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)
          jwt="${header}.${payload}.${signature}"
          install_json=$(curl -sS \
            -H "Authorization: Bearer ${jwt}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/installation")
          install_id=$(printf '%s' "$install_json" | jq -r '.id // empty')
          if [ -z "$install_id" ]; then
            echo "squirrelbot-ci is not installed on this repository." >&2
            exit 1
          fi
          token_json=$(curl -sS -X POST \
            -H "Authorization: Bearer ${jwt}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${install_id}/access_tokens")
          token=$(printf '%s' "$token_json" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "Could not create an installation token." >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          basic=$(printf 'x-access-token:%s' "$token" | base64 -w0)
          echo "::add-mask::${basic}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic}"

      - name: Choose the version
        id: version
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: patch
        run: |
          set -euo pipefail
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "unsupported bump: $BUMP" >&2; exit 1 ;;
          esac

          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          owner="${image#ghcr.io/}"
          owner="${owner%%/*}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "chart=ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"

          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/chart-commit.sh"
          latest=$(git tag --list 'v*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          head=$(git rev-parse HEAD)
          if [ -n "$latest" ]; then
            latest_sha=$(git rev-parse "${latest}^{}")
          else
            latest_sha=
          fi
          if [ -n "$latest" ] && { [ "$latest_sha" = "$head" ] || is_chart_commit "$latest_sha" "$head"; }; then
            version="${latest#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            if gh release view "$latest" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "resume=false" >> "$GITHUB_OUTPUT"
              echo "${latest} is already released."
              exit 0
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            echo "Finishing ${latest}. The tag exists and the GitHub release does not."
            exit 0
          fi

          bump() {
            local ver=$1 kind=$2
            local major minor patch
            IFS=. read -r major minor patch <<< "$ver"
            case "$kind" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            printf '%s.%s.%s\n' "$major" "$minor" "$patch"
          }

          if [ -z "$latest" ]; then
            version=0.1.0
          else
            version=$(bump "${latest#v}" "$BUMP")
          fi
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "resume=false" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Set up Go
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Helm
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: azure/setup-helm@v4

      - name: Set up QEMU
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build archives
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          mkdir -p dist
          targets='linux/amd64 linux/arm64 darwin/amd64 darwin/arm64'
          for target in $targets; do
            os=${target%/*}
            arch=${target#*/}
            stage=$(mktemp -d)
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$stage/squirrelbot" ./cmd/squirrelbot
            mkdir -p "$stage/web"
            cp -a web/build "$stage/web/build"
            cp LICENSE "$stage/LICENSE"
            tar -C "$stage" -czf "dist/squirrelbot_${VERSION}_${os}_${arch}.tar.gz" squirrelbot web LICENSE
            rm -rf "$stage"
          done

      - name: Set the chart version
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          script="${RUNNER_TEMP}/set-chart-version.py"
          cat > "$script" <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          chart = Path(os.environ["CHART"])
          lines = chart.read_text().splitlines()
          saw_version = False
          saw_app = False
          for i, line in enumerate(lines):
              if line.startswith("version:"):
                  lines[i] = f"version: {version}"
                  saw_version = True
              elif line.startswith("appVersion:"):
                  lines[i] = f'appVersion: "{version}"'
                  saw_app = True
          if not saw_version or not saw_app:
              raise SystemExit("Chart.yaml is missing version or appVersion")
          chart.write_text("\n".join(lines) + "\n")
          PY
          CHART=deploy/helm/squirrelbot/Chart.yaml python3 "$script"

      - name: Package the chart
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chart_version=$(awk '/^version:/{print $2; exit}' deploy/helm/squirrelbot/Chart.yaml)
          app_version=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' deploy/helm/squirrelbot/Chart.yaml)
          if [ "$chart_version" != "$VERSION" ] || [ "$app_version" != "$VERSION" ]; then
            echo "Chart.yaml is ${chart_version} / ${app_version}, expected ${VERSION}." >&2
            exit 1
          fi
          helm package deploy/helm/squirrelbot --destination dist
          (
            cd dist
            sha256sum squirrelbot_"${VERSION}"_*.tar.gz "squirrelbot-${VERSION}.tgz" > SHA256SUMS
          )

      - name: Confirm main has not moved
        id: recheck
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/chart-commit.sh"
          git fetch origin main
          head=$(git rev-parse HEAD)
          main=$(git rev-parse origin/main)
          if [ "$head" = "$main" ] || is_chart_commit "$main" "$head" "$VERSION"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main moved during the build. A newer run will publish the release."
          fi

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MPL-2.0
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push the chart
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART: ${{ steps.version.outputs.chart }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/squirrelbot-${VERSION}.tgz" "oci://${CHART}"

      - name: Publish the GitHub release
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          CHART: ${{ steps.version.outputs.chart }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME: ${{ steps.version.outputs.resume }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/chart-commit.sh"
          git fetch origin main --tags
          head=$(git rev-parse HEAD)
          main=$(git rev-parse origin/main)
          if [ "$head" != "$main" ] && ! is_chart_commit "$main" "$head" "$VERSION"; then
            echo "main moved during publish. A newer run will release."
            exit 0
          fi

          release_sha=$main
          if [ "$head" = "$main" ]; then
            wt="${RUNNER_TEMP}/chart-main"
            git worktree prune
            rm -rf "$wt"
            git worktree add --detach "$wt" HEAD
            CHART="${wt}/deploy/helm/squirrelbot/Chart.yaml" python3 "${RUNNER_TEMP}/set-chart-version.py"
            git -C "$wt" add -- deploy/helm/squirrelbot/Chart.yaml
            if ! git -C "$wt" diff --cached --quiet; then
              git -C "$wt" \
                -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit \
                -m "Update the Helm chart to ${VERSION}." \
                -m "[skip release]"
              git -C "$wt" push origin HEAD:main
              release_sha=$(git -C "$wt" rev-parse HEAD)
            fi
          fi

          if [ "$RESUME" != "true" ]; then
            git tag "v${VERSION}" "$release_sha"
          fi
          git push origin "v${VERSION}"

          chart_dir="${RUNNER_TEMP}/helm-index"
          prev="${RUNNER_TEMP}/helm-index-prev"
          rm -rf "$chart_dir" "$prev"
          mkdir -p "$chart_dir" "$prev"
          cp "dist/squirrelbot-${VERSION}.tgz" "$chart_dir/"
          index_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          merge_args=()
          if gh release download --pattern index.yaml --dir "$prev" --clobber >/dev/null 2>&1; then
            merge_args=(--merge "$prev/index.yaml")
          fi
          helm repo index "$chart_dir" --url "$index_url" "${merge_args[@]}"
          cp "$chart_dir/index.yaml" dist/index.yaml

          latest=$(git tag --list 'v*' --sort=-v:refname | awk -v current="v${VERSION}" '$0 != current && /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo "Container image: \`${IMAGE}:${VERSION}\`"
            echo
            echo "Helm chart:"
            echo
            echo '```sh'
            echo "helm repo add squirrelbot https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
            echo "helm upgrade --install squirrelbot squirrelbot/squirrelbot --version ${VERSION}"
            echo '```'
            echo
            echo "Binary archives include \`squirrelbot\`, \`web/build\`, and \`LICENSE\`. Extract an archive and run \`./squirrelbot\` from that directory."
            echo
            echo "Changes:"
            echo
            if [ -n "$latest" ]; then
              log_range="${latest}..v${VERSION}"
            else
              log_range="v${VERSION}"
            fi
            git log --pretty=format:'- %s' "$log_range" \
              | grep -v '^- Update the Helm chart to ' \
              || true
            echo
          } > "$notes"

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "$notes" \
            "dist/SHA256SUMS" \
            "dist/index.yaml" \
            dist/squirrelbot_"${VERSION}"_*.tar.gz \
            "dist/squirrelbot-${VERSION}.tgz"

      - name: Commit the chart version
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chart=deploy/helm/squirrelbot/Chart.yaml
          script="${RUNNER_TEMP}/set-chart-version.py"

          version_gt() {
            local left=$1 right=$2
            local lmaj lmin lpat rmaj rmin rpat
            IFS=. read -r lmaj lmin lpat <<< "$left"
            IFS=. read -r rmaj rmin rpat <<< "$right"
            local part
            for part in "$lmaj" "$lmin" "$lpat" "$rmaj" "$rmin" "$rpat"; do
              case "$part" in
                ''|*[!0-9]*) return 1 ;;
              esac
            done
            if [ "$((10#$lmaj))" -gt "$((10#$rmaj))" ]; then return 0; fi
            if [ "$((10#$lmaj))" -lt "$((10#$rmaj))" ]; then return 1; fi
            if [ "$((10#$lmin))" -gt "$((10#$rmin))" ]; then return 0; fi
            if [ "$((10#$lmin))" -lt "$((10#$rmin))" ]; then return 1; fi
            if [ "$((10#$lpat))" -gt "$((10#$rpat))" ]; then return 0; fi
            return 1
          }

          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "origin/main does not contain this commit. Leaving Chart.yaml unchanged."
            exit 0
          fi
          main_version=$(git show "origin/main:${chart}" | awk '/^version:/{gsub(/"/,"",$2); print $2; exit}')
          if [ "$main_version" = "$VERSION" ]; then
            echo "Chart.yaml on main is already ${VERSION}."
            exit 0
          fi
          if version_gt "$main_version" "$VERSION"; then
            echo "Chart.yaml on main is ${main_version}, which is newer than ${VERSION}."
            exit 0
          fi

          wt="${RUNNER_TEMP}/chart-main"
          git worktree prune
          rm -rf "$wt"
          git worktree add --detach "$wt" origin/main
          CHART="${wt}/${chart}" python3 "$script"
          git -C "$wt" add -- "$chart"
          if git -C "$wt" diff --cached --quiet; then
            echo "Chart.yaml on main already matches ${VERSION}."
            exit 0
          fi
          git -C "$wt" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit \
            -m "Update the Helm chart to ${VERSION}." \
            -m "[skip release]"
          git -C "$wt" push origin HEAD:main

      - name: Set package visibility
        if: steps.gate.outputs.skip != 'true' && steps.version.outputs.skip != 'true' && steps.recheck.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          set -euo pipefail
          image_name="${IMAGE##*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          visibility=private
          if [ "$VISIBILITY" = "public" ]; then
            visibility=public
          fi
          for name in "$image_name" "charts/${image_name}"; do
            gh api --method PATCH "/orgs/${owner}/packages/container/${name}" -f visibility="$visibility" \
              || gh api --method PATCH "/users/${owner}/packages/container/${name}" -f visibility="$visibility" \
              || echo "Could not set ${name} visibility to ${visibility}." >&2
          done
