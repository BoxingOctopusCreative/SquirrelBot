{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "squirrelbot.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "squirrelbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- $annotations := dict }}
  {{- if .Values.ingress.tls }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.tls" "true" }}
  {{- end }}
  {{- if and .Values.ingress.tls .Values.ingress.certResolver }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.tls.certresolver" .Values.ingress.certResolver }}
  {{- end }}
  {{- $annotations = merge $annotations (.Values.ingress.annotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ include "squirrelbot.host" . }}
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ include "squirrelbot.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "squirrelbot.fullname" . }}
                port:
                  name: http
{{- end }}
