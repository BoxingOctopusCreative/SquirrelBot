apiVersion: v1
kind: Service
metadata:
  name: {{ include "squirrelbot.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "squirrelbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "squirrelbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      {{- if .Values.service }}
      port: {{ .Values.service.port | default 8080 }}
      {{- else }}
      port: 8080
      {{- end }}
      targetPort: http
