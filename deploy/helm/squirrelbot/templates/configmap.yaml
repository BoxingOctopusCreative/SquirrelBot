apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "squirrelbot.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "squirrelbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  PUBLIC_URL: {{ required "publicUrl is required" .Values.publicUrl | quote }}
  HTTP_ADDR: ":8080"
  WEB_DIR: "/web/build"
