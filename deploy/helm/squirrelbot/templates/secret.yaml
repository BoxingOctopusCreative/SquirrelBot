{{- if not .Values.existingSecret }}
{{- if and .Values.postgres.bundled (not .Values.postgres.auth.password) }}
{{- fail "postgres.auth.password is required when postgres.bundled is true" }}
{{- end }}
{{- if lt (len .Values.secrets.sessionSecret) 32 }}
{{- fail "secrets.sessionSecret must be at least 32 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "squirrelbot.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "squirrelbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DISCORD_TOKEN: {{ required "secrets.discordToken is required" .Values.secrets.discordToken | quote }}
  DISCORD_CLIENT_ID: {{ required "secrets.discordClientId is required" .Values.secrets.discordClientId | quote }}
  DISCORD_CLIENT_SECRET: {{ required "secrets.discordClientSecret is required" .Values.secrets.discordClientSecret | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  DATABASE_URL: {{ include "squirrelbot.databaseUrl" . | quote }}
{{- end }}
