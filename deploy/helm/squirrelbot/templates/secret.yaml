{{- if not .Values.existingSecret }}
{{- if and .Values.postgres.enabled (not .Values.postgres.auth.password) }}
{{- fail "postgres.auth.password is required when postgres.enabled is true" }}
{{- end }}
{{- if lt (len .Values.secrets.sessionSecret) 32 }}
{{- fail "secrets.sessionSecret must be at least 32 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "squirrelbot.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "squirrelbot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DISCORD_TOKEN: {{ required "secrets.discordToken is required" .Values.secrets.discordToken | quote }}
  DISCORD_CLIENT_ID: {{ required "secrets.discordClientId is required" .Values.secrets.discordClientId | quote }}
  DISCORD_CLIENT_SECRET: {{ required "secrets.discordClientSecret is required" .Values.secrets.discordClientSecret | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.auth.username (.Values.postgres.auth.password | urlquery) (include "squirrelbot.fullname" .) .Values.postgres.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required when postgres.enabled is false" .Values.secrets.databaseUrl | quote }}
  {{- end }}
{{- end }}
