imagePullSecrets: []

# The Discord gateway allows one session per bot token. The Deployment
# hardcodes replicas to 1 and uses Recreate. Do not scale this chart.

publicUrl: ""

existingSecret: ""

secrets:
  databaseUrl: ""
  discordToken: ""
  discordClientId: ""
  discordClientSecret: ""
  sessionSecret: ""

# enabled creates the Ingress. Set it to false to skip the Ingress.
# className is the IngressClass. The default is traefik.
# The host comes from publicUrl.
# annotations are copied onto the Ingress.
# tls asks Traefik to serve HTTPS. certResolver is the ACME resolver
# in Traefik's static config. Traefik stores the certificate in
# tlsSecretName. Clear certResolver to use a certificate that
# already exists in that Secret.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  tls: true
  certResolver: letsencrypt
  tlsSecretName: squirrelbot-tls

# bundled starts a Postgres StatefulSet for this release.
# Leave it false and set secrets.databaseUrl for an external database.
# sslMode is the libpq mode: disable, allow, prefer, require,
# verify-ca, or verify-full. The bundled server does not terminate
# TLS, so that database uses disable. An external database uses
# require. An sslmode already in secrets.databaseUrl is kept.
postgres:
  bundled: false
  image: postgres:16-alpine
  auth:
    database: squirrelbot
    username: squirrelbot
    password: ""
  persistence:
    size: 8Gi
    storageClass: ""
