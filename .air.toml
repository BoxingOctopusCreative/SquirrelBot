root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/squirrelbot"
bin = "./tmp/main"
include_ext = ["go", "sql"]
include_file = [".env"]
exclude_dir = ["tmp", "web", "deploy", "bin", "vendor"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = false
send_interrupt = true
kill_delay = "12s"

[screen]
clear_on_rebuild = false
keep_scroll = true

[misc]
clean_on_exit = true
